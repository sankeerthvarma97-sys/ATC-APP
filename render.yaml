# Render Infrastructure Blueprint for AOCC Platform
# Supports 1-Click Production Deployment with persistent WebSocket server + PostgreSQL
services:
  - type: web
    name: aocc-aviation-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Starter or higher recommended for 24/7 aviation WebSocket uptime
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXTAUTH_URL
        sync: false # Set to your Render URL e.g. https://aocc-aviation-platform.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aocc-postgres
          property: connectionString
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        value: Sankeerth@80
      - key: SIMULATION_TICK_RATE_MS
        value: 1200
      - key: NEXT_PUBLIC_AIRPORT_CODE
        value: HYD
      - key: NEXT_PUBLIC_AIRPORT_NAME
        value: "Rajiv Gandhi International Airport (HYD)"

databases:
  - name: aocc-postgres
    plan: free # Free or Starter managed PostgreSQL
    region: oregon
    databaseName: aocc_db
    user: aocc_admin
