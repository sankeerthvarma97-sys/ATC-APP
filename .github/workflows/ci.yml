name: AOCC Aviation CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build, Lint & Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Strict Static Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit & RBAC Test Suite
        run: npx vitest run

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Production Bundle Build Validation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
